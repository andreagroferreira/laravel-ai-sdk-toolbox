name: Bug Report
description: Report a reproducible problem with the package
labels: ["bug"]
body:
  - type: input
    id: package-version
    attributes:
      label: Package version
      description: The version of andreagroferreira/laravel-ai-sdk-toolbox you are using (composer show)
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
      placeholder: "13.x"
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.4"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem, including the exact error message if any.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: Minimal steps, code, or skill/tool that triggers the problem.
      placeholder: |
        1. composer require ...
        2. php artisan ai:skill-install ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
