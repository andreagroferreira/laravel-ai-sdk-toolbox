name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: none
      - run: composer validate --strict

  pint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint --test

  phpstan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: none
      - name: Cache PHPStan
        uses: actions/cache@v4
        with:
          path: /tmp/phpstan
          key: ${{ runner.os }}-phpstan-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-phpstan-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/phpstan --no-progress

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_toolbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        stability: [prefer-stable, prefer-lowest]
    name: PHP ${{ matrix.php }} — ${{ matrix.stability }}
    env:
      KB_TEST_PGSQL: '1'
      KB_TEST_PGSQL_HOST: 127.0.0.1
      KB_TEST_PGSQL_PORT: 5432
      KB_TEST_PGSQL_DATABASE: ai_toolbox_test
      KB_TEST_PGSQL_USERNAME: postgres
      KB_TEST_PGSQL_PASSWORD: postgres
      KB_TEST_QDRANT: '1'
      KB_TEST_QDRANT_URL: http://127.0.0.1:6333
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: pdo_pgsql, pgsql
      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --${{ matrix.stability }}
      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:6333/healthz > /dev/null; then echo "Qdrant is ready"; exit 0; fi
            sleep 1
          done
          echo "Qdrant did not become ready" && exit 1
      - run: vendor/bin/pest --colors=never
