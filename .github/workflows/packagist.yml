name: packagist

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  update-packagist:
    needs: tests
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag matches VERSION
        if: github.event_name == 'push'
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qF "VERSION = '${version}'" src/AiSdkToolbox.php; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match AiSdkToolbox::VERSION in src/AiSdkToolbox.php."
            exit 1
          fi

      - name: Check the tagged commit is on main
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points to a commit that is not on main."
            exit 1
          fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Check Packagist credentials
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        run: |
          if [ -z "$PACKAGIST_USERNAME" ] || [ -z "$PACKAGIST_API_TOKEN" ]; then
            echo "::error::Set the PACKAGIST_USERNAME and PACKAGIST_API_TOKEN repository secrets (from https://packagist.org/profile/edit)."
            exit 1
          fi

      - name: Trigger Packagist update
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
        run: |
          response=$(curl -sS -o /tmp/packagist-response.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"repository":{"url":"https://packagist.org/packages/andreagroferreira/laravel-ai-sdk-toolbox"}}' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_API_TOKEN}")
          cat /tmp/packagist-response.json
          echo "HTTP status: $response"
          test "$response" -ge 200 -a "$response" -lt 300
